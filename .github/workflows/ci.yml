name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    uses: roschaefer/reusable-workflows/.github/workflows/rust-ci.yml@795945679ebed3f6d63aceaa4a0e7c7944191cbc # main
    permissions:
      contents: write
    with:
      binary_name: hledger-elster
      platforms: '["linux-x86_64","macos-arm64"]'
      needs_hledger: true
      needs_scrut: true
