[package]
name = "hledger-elster"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "German tax calculation and ELSTER-oriented exports for hledger"

[lib]
name = "hledger_elster"
path = "src/lib.rs"

[[bin]]
name = "hledger-elster"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
csv = "1.4.0"
indexmap = "2.14.2"
regex = "1.13.2"
rust_decimal = "1.43.0"
rust_xlsxwriter = "0.104.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.2"
unicode-normalization = "0.1.26"
walkdir = "2.5.1"
zip = "9.8.2"

[dev-dependencies]
rust_decimal_macros = "1.40.0"
tempfile = "3.27.0"
